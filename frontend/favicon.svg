<!-- Save this as favicon.svg and reference it in your HTML head -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Face outline -->
  <circle cx="32" cy="32" r="18" fill="#ffffff" opacity="0.9"/>

  <!-- Eyes (one normal, one raised brow look) -->
  <circle cx="25" cy="28" r="2.5" fill="#1f2937"/>
  <circle cx="39" cy="27" r="2.5" fill="#1f2937"/>

  <!-- Eyebrow (sarcastic raise) -->
  <path d="M35 22 Q42 18 47 23" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Smirk -->
  <path d="M24 38 Q32 44 44 36" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

<!-- Then in your HTML head, use: -->
<!-- <link rel="icon" type="image/svg+xml" href="favicon.svg"> -->
